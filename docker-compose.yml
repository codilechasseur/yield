services:
  pocketbase:
    image: ghcr.io/codilechasseur/yield-pocketbase:latest
    restart: unless-stopped
    volumes:
      - pb_data:/pb/pb_data
    environment:
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    image: ghcr.io/codilechasseur/yield:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PB_URL=http://pocketbase:8090
      # The app signs in to PocketBase as this superuser — all collections are
      # superuser-only, so these are required.
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD}
      - ORIGIN=${ORIGIN}
      - APP_PASSWORD=${APP_PASSWORD}
      # Header your reverse proxy puts the client IP in (used for login rate
      # limiting). Leave empty if the app is not behind a proxy.
      - ADDRESS_HEADER=${ADDRESS_HEADER:-}
      - XFF_DEPTH=${XFF_DEPTH:-1}
    depends_on:
      pocketbase:
        condition: service_healthy

volumes:
  pb_data:
